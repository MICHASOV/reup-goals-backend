name: Activate German production database

permissions:
  contents: read

concurrency:
  group: production-germany-migration
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure German production SSH
        env:
          GERMANY_KEY_B64: ${{ secrets.STAGING_SSH_KEY_B64 }}
          GERMANY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          GERMANY_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$GERMANY_KEY_B64" ]; then
            printf '%s' "$GERMANY_KEY_B64" | base64 -d > ~/.ssh/germany_key
          elif [ -n "$GERMANY_KEY" ]; then
            printf '%s\n' "$GERMANY_KEY" | tr -d '\r' > ~/.ssh/germany_key
          else
            echo "German production SSH key is missing." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/germany_key
          ssh-keygen -y -f ~/.ssh/germany_key >/dev/null
          ssh-keyscan -H "$GERMANY_HOST" >> ~/.ssh/known_hosts

      - name: Verify German production access
        env:
          GERMANY_HOST: ${{ secrets.STAGING_HOST }}
          GERMANY_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/germany_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            "${GERMANY_USER}@${GERMANY_HOST}" 'printf GERMANY_SSH_OK'

      - name: Upload database cutover scripts
        env:
          GERMANY_HOST: ${{ secrets.STAGING_HOST }}
          GERMANY_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/germany_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            scripts/prepare-germany-production-database.sh \
            scripts/activate-germany-production-database.sh \
            "${GERMANY_USER}@${GERMANY_HOST}:/tmp/"

      - name: Configure German production HTTPS
        env:
          GERMANY_HOST: ${{ secrets.STAGING_HOST }}
          GERMANY_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/germany_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=6 \
            -o IdentitiesOnly=yes \
            "${GERMANY_USER}@${GERMANY_HOST}" bash -s <<'REMOTE'
          set -Eeuo pipefail

          backend_env=/etc/reup-goals-production/backend.env
          email=reupgoals@gmail.com
          require_file() {
            if [ ! -s "$1" ]; then
              printf 'REQUIRED_FILE_MISSING=%s\n' "$1" >&2
              echo 'AVAILABLE_CONFIGURATION_FILES:' >&2
              find /etc/reup-goals-production /etc/reup-goals-staging \
                -maxdepth 2 -type f -printf '%p\n' 2>/dev/null >&2 || true
              echo 'PRODUCTION_SERVICE_CONFIGURATION:' >&2
              systemctl show reup-goals-production.service \
                --property=FragmentPath \
                --property=DropInPaths \
                --property=EnvironmentFiles \
                --no-pager >&2 || true
              echo 'AVAILABLE_WEB_ROOTS:' >&2
              find /var/www -maxdepth 3 -type f -name index.html -print >&2 || true
              exit 1
            fi
          }
          require_file "$backend_env"
          require_file /var/www/reupgoals.pro/index.html
          require_file /var/www/reupgoals.pro/login/index.html

          set_env() {
            local file=$1 key=$2 value=$3 escaped
            escaped=$(printf '%s' "$value" | sed 's/[&|]/\\&/g')
            if grep -qE "^${key}=" "$file"; then
              sed -i -E "s|^${key}=.*$|${key}=${escaped}|" "$file"
            else
              printf '%s=%s\n' "$key" "$value" >> "$file"
            fi
          }
          set_env "$backend_env" CROSS_BORDER_TRANSFER_REGISTERED true

          command -v certbot >/dev/null 2>&1 || {
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              certbot python3-certbot-nginx
          }

          cat > /etc/nginx/sites-available/reupgoals-production <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name reupgoals.pro www.reupgoals.pro;
              server_tokens off;
              root /var/www/reupgoals.pro;
              index index.html;
              location / { try_files $uri $uri/ =404; }
          }
          NGINX
          cat > /etc/nginx/sites-available/reupgoals-api-production <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name api.reupgoals.pro;
              server_tokens off;
              client_max_body_size 90m;
              client_body_timeout 3600s;
              location / {
                  proxy_pass http://127.0.0.1:8082;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_connect_timeout 15s;
                  proxy_send_timeout 3600s;
                  proxy_read_timeout 3600s;
                  proxy_request_buffering off;
                  proxy_buffering off;
              }
          }
          NGINX
          ln -sfn /etc/nginx/sites-available/reupgoals-production \
            /etc/nginx/sites-enabled/reupgoals-production
          ln -sfn /etc/nginx/sites-available/reupgoals-api-production \
            /etc/nginx/sites-enabled/reupgoals-api-production
          nginx -t
          systemctl reload nginx

          certbot --nginx --non-interactive --agree-tos --redirect \
            --email "$email" -d reupgoals.pro -d www.reupgoals.pro
          certbot --nginx --non-interactive --agree-tos --redirect \
            --email "$email" -d api.reupgoals.pro
          nginx -t
          systemctl reload nginx

          curl --fail --silent --show-error --max-time 30 \
            --resolve reupgoals.pro:443:127.0.0.1 \
            https://reupgoals.pro/login/ >/dev/null
          curl --fail --silent --show-error --max-time 30 \
            --resolve api.reupgoals.pro:443:127.0.0.1 \
            https://api.reupgoals.pro/readyz >/dev/null
          REMOTE

      - name: Freeze writes and activate local PostgreSQL
        env:
          GERMANY_HOST: ${{ secrets.STAGING_HOST }}
          GERMANY_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/germany_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=6 \
            -o IdentitiesOnly=yes \
            "${GERMANY_USER}@${GERMANY_HOST}" bash -s <<'REMOTE'
          set -Eeuo pipefail

          api_service=reup-goals-production.service
          agent_service=reup-goals-agent-production.service
          activate_script=/tmp/activate-germany-production-database.sh
          prepare_script=/tmp/prepare-germany-production-database.sh

          chmod 700 "$activate_script" "$prepare_script"
          grep -qx 'CROSS_BORDER_TRANSFER_REGISTERED=true' \
            /etc/reup-goals-production/backend.env

          recover_services() {
            local exit_code=$?
            trap - ERR
            active_host=$(grep -E '^DB_HOST=' /etc/reup-goals-production/backend.env \
              | tail -1 | cut -d= -f2- || true)
            if [ "$active_host" = 127.0.0.1 ] || [ "$active_host" = localhost ] || [ "$active_host" = ::1 ]; then
              "$activate_script" rollback >/dev/null 2>&1 || true
            else
              systemctl start "$api_service" "$agent_service" >/dev/null 2>&1 || true
            fi
            exit "$exit_code"
          }
          trap recover_services ERR

          # The public API already runs on this host. Stopping both services here
          # freezes application writes while the final source snapshot is copied.
          systemctl stop "$agent_service" "$api_service"
          REUP_DATABASE_PREPARE_SCRIPT="$prepare_script" "$activate_script" prepare
          "$activate_script" activate
          trap - ERR
          "$activate_script" status
          REMOTE

      - name: Verify German production
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            api_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
              https://api.reupgoals.pro/readyz || true)
            legal_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
              https://api.reupgoals.pro/api/v2/privacy/legal-documents || true)
            app_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
              https://reupgoals.pro/cabinet-v2/ || true)
            if [ "$api_code" = 200 ] && [ "$legal_code" = 200 ] && [ "$app_code" = 200 ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Production smoke checks did not recover in time." >&2
          exit 1

      - name: Report active database without secrets
        env:
          GERMANY_HOST: ${{ secrets.STAGING_HOST }}
          GERMANY_USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh -i ~/.ssh/germany_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            "${GERMANY_USER}@${GERMANY_HOST}" \
            '/tmp/activate-germany-production-database.sh status'

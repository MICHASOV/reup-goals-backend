name: Deploy production AI runtime

permissions:
  contents: read

concurrency:
  group: production-ai-runtime
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "agent-runtime/**"
      - "deploy/production/ai-runtime.env.example"
      - "deploy/production/nginx-ai.conf.example"
      - "deploy/production/reup-goals-ai.service"
      - ".github/workflows/deploy-production-ai.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json

      - name: Test and build runtime
        working-directory: agent-runtime
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm prune --omit=dev
          cp "$(command -v node)" node
          tar -czf ../ai-runtime.tar.gz dist node_modules package.json package-lock.json node

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${{ secrets.STAGING_SSH_KEY_B64 }}" ]; then
            printf '%s' "${{ secrets.STAGING_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/germany_key
          else
            printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" | tr -d '\r' > ~/.ssh/germany_key
          fi
          chmod 600 ~/.ssh/germany_key
          ssh-keygen -y -f ~/.ssh/germany_key >/dev/null
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload runtime
        run: |
          scp -i ~/.ssh/germany_key -o IdentitiesOnly=yes \
            ai-runtime.tar.gz \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/tmp/reup-goals-ai-runtime.tar.gz"

      - name: Install runtime and TLS gateway
        run: |
          ssh -i ~/.ssh/germany_key -o IdentitiesOnly=yes \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          service=reup-goals-ai.service
          root=/opt/reup-goals-ai
          next=${root}.next
          previous=${root}.previous
          env_file=/etc/reup-goals/ai-production.env
          unit=/etc/systemd/system/${service}
          site=/etc/nginx/sites-available/ai.reupgoals.pro
          enabled=/etc/nginx/sites-enabled/ai.reupgoals.pro
          runtime_port=8092

          missing_packages=()
          command -v nginx >/dev/null 2>&1 || missing_packages+=(nginx)
          command -v certbot >/dev/null 2>&1 || missing_packages+=(certbot python3-certbot-nginx)
          if [ "${#missing_packages[@]}" -gt 0 ]; then
            for attempt in $(seq 1 20); do
              if apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y "${missing_packages[@]}"; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "Package manager remained unavailable." >&2
                exit 1
              fi
              sleep 10
            done
          fi

          if [ ! -f "$env_file" ]; then
            echo "$env_file is missing. Install deploy/production/ai-runtime.env.example and set the production credentials." >&2
            exit 1
          fi
          set_env() {
            key=$1
            value=$2
            if grep -q "^${key}=" "$env_file"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$env_file"
            else
              printf '\n%s=%s\n' "$key" "$value" >> "$env_file"
            fi
          }
          set_env PORT 8092
          set_env LISTEN_HOST 127.0.0.1
          set_env GO_INTERNAL_URL https://api.reupgoals.pro
          set_env AI_GATEWAY_MAX_REQUEST_BYTES 134217728
          set_env OPENAI_UPSTREAM_URL https://api.openai.com
          set_env OPENAI_PROXY_URL direct
          set_env AGENT_COMPACT_THRESHOLD 100000
          set_env AGENT_REASONING_EFFORT max

          read_env() { grep -E "^$1=" "$env_file" | tail -1 | cut -d= -f2- || true; }
          openai_key=$(read_env OPENAI_API_KEY)
          runtime_secret=$(read_env AGENT_RUNTIME_SECRET)
          gateway_secret=$(read_env AI_GATEWAY_SECRET)
          go_internal_url=$(read_env GO_INTERNAL_URL)
          configured_port=$(read_env PORT)
          runtime_port=${configured_port:-8092}
          if [ -z "$openai_key" ] || [ "${#runtime_secret}" -lt 32 ] || [ "${#gateway_secret}" -lt 32 ]; then
            echo "Production AI key or service secrets are missing." >&2
            exit 1
          fi
          if [ "$runtime_secret" = "$gateway_secret" ]; then
            echo "AGENT_RUNTIME_SECRET and AI_GATEWAY_SECRET must be different." >&2
            exit 1
          fi
          if [[ "$go_internal_url" != https://* ]]; then
            echo "GO_INTERNAL_URL must use HTTPS." >&2
            exit 1
          fi
          if ! [[ "$runtime_port" =~ ^[0-9]+$ ]] || [ "$runtime_port" -lt 1 ] || [ "$runtime_port" -gt 65535 ]; then
            echo "PORT is invalid." >&2
            exit 1
          fi

          rollback() {
            exit_code=$?
            trap - ERR
            systemctl stop "$service" >/dev/null 2>&1 || true
            rm -rf "$root"
            [ -d "$previous" ] && mv "$previous" "$root"
            systemctl daemon-reload
            [ -d "$root" ] && systemctl start "$service" >/dev/null 2>&1 || true
            journalctl -u "$service" -n 120 --no-pager || true
            exit "$exit_code"
          }
          trap rollback ERR

          rm -rf "$next"
          mkdir -p "$next"
          tar -xzf /tmp/reup-goals-ai-runtime.tar.gz -C "$next"
          test -x "$next/node"
          test -f "$next/dist/server.js"
          rm -rf "$previous"
          [ -d "$root" ] && mv "$root" "$previous"
          mv "$next" "$root"

          cat > "$unit" <<'UNIT'
          [Unit]
          Description=REUP.goals German AI Runtime and Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=www-data
          Group=www-data
          WorkingDirectory=/opt/reup-goals-ai
          Environment=NODE_ENV=production
          EnvironmentFile=/etc/reup-goals/ai-production.env
          ExecStart=/opt/reup-goals-ai/node dist/server.js
          Restart=always
          RestartSec=3
          TimeoutStopSec=30
          KillSignal=SIGTERM
          NoNewPrivileges=true
          PrivateTmp=true
          PrivateDevices=true
          ProtectHome=true
          ProtectSystem=strict
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true
          LockPersonality=true
          CapabilityBoundingSet=
          AmbientCapabilities=
          UMask=0077

          [Install]
          WantedBy=multi-user.target
          UNIT
          chmod 644 "$unit"
          chown -R www-data:www-data "$root"
          chmod 600 "$env_file"
          systemctl daemon-reload
          systemctl enable "$service"
          systemctl restart "$service"

          for attempt in $(seq 1 60); do
            health=$(curl --fail --silent "http://127.0.0.1:${runtime_port}/healthz" || true)
            if [[ "$health" == *'"runtime":true'* ]] && [[ "$health" == *'"gateway":true'* ]]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "AI runtime failed its local health check." >&2
              exit 1
            fi
            sleep 1
          done

          # A temporary HTTP-only virtual host lets Certbot issue the first
          # certificate without disturbing the existing staging endpoint.
          if [ ! -f /etc/letsencrypt/live/ai.reupgoals.pro/fullchain.pem ]; then
            cat > "$site" <<'NGINX_HTTP'
          server {
              listen 80;
              listen [::]:80;
              server_name ai.reupgoals.pro;
              location / { return 404; }
          }
          NGINX_HTTP
            ln -sf "$site" "$enabled"
            nginx -t
            systemctl reload nginx
            certbot certonly --nginx --non-interactive --agree-tos --register-unsafely-without-email \
              -d ai.reupgoals.pro
          fi

          cat > "$site" <<'NGINX'
          limit_req_zone $binary_remote_addr zone=reup_ai:10m rate=30r/s;

          server {
              listen 80;
              listen [::]:80;
              server_name ai.reupgoals.pro;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              listen [::]:443 ssl http2;
              server_name ai.reupgoals.pro;
              server_tokens off;

              ssl_certificate /etc/letsencrypt/live/ai.reupgoals.pro/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/ai.reupgoals.pro/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_session_timeout 1d;
              ssl_session_cache shared:REUPAI:10m;
              ssl_session_tickets off;

              client_max_body_size 128m;
              client_body_timeout 3600s;
              client_header_timeout 15s;
              keepalive_timeout 30s;
              add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "no-referrer" always;

              location = /healthz {
                  proxy_pass http://127.0.0.1:8092;
                  proxy_set_header Host $host;
                  proxy_hide_header Server;
              }

              location ~ ^/(v1/runs/|openai/) {
                  allow 109.73.198.164;
                  deny all;
                  limit_req zone=reup_ai burst=120 nodelay;
                  proxy_pass http://127.0.0.1:8092;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_connect_timeout 10s;
                  proxy_send_timeout 3600s;
                  proxy_read_timeout 3600s;
                  proxy_request_buffering off;
                  proxy_buffering off;
                  proxy_hide_header Server;
              }

              location / { return 404; }
          }
          NGINX
          ln -sf "$site" "$enabled"
          nginx -t
          systemctl reload nginx

          trap - ERR
          rm -rf "$previous"
          systemctl status "$service" --no-pager
          REMOTE

      - name: Verify public endpoint
        run: |
          health=$(curl --fail --show-error --silent --retry 5 --retry-all-errors \
            https://ai.reupgoals.pro/healthz)
          printf '%s\n' "$health"
          [[ "$health" == *'"runtime":true'* ]]
          [[ "$health" == *'"gateway":true'* ]]

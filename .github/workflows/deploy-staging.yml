name: Deploy backend staging

permissions:
  contents: read

concurrency:
  group: backend-staging
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json

      - name: Test
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet -exclude-generated ./...

      - name: Build agent runtime
        working-directory: agent-runtime
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm prune --omit=dev
          cp "$(command -v node)" node
          tar -czf ../agent-runtime.tar.gz dist node_modules package.json package-lock.json node

      - name: Build Linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o reup_goals_backend ./cmd/api

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${{ secrets.STAGING_SSH_KEY_B64 }}" ]; then
            printf '%s' "${{ secrets.STAGING_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/staging_key
          else
            printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" | tr -d '\r' > ~/.ssh/staging_key
          fi
          chmod 600 ~/.ssh/staging_key
          ssh-keygen -y -f ~/.ssh/staging_key >/dev/null
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare staging backend host
        run: |
          ssh -i ~/.ssh/staging_key -o IdentitiesOnly=yes \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          missing_packages=()
          command -v nginx >/dev/null 2>&1 || missing_packages+=(nginx)
          command -v certbot >/dev/null 2>&1 || missing_packages+=(certbot python3-certbot-nginx)
          fc-list | grep -qi "DejaVu" || missing_packages+=(fonts-dejavu-core)
          if [ "${#missing_packages[@]}" -gt 0 ]; then
            for attempt in $(seq 1 20); do
              if apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y "${missing_packages[@]}"; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "apt remained locked after 20 attempts"
                exit 1
              fi
              sleep 10
            done
          fi

          mkdir -p /opt/reup-goals-staging/backend /opt/reup-goals-staging/agent /etc/reup-goals-staging

          if [ ! -f /etc/reup-goals-staging/backend.env ]; then
            cat >/etc/reup-goals-staging/backend.env <<'ENV'
          # Fill staging values before starting the backend.
          DB_HOST=
          DB_PORT=5432
          DB_USER=
          DB_PASSWORD=
          DB_NAME=
          DB_SSLMODE=require
          DB_APPLICATION_NAME=reup-goals-staging
          DB_MAX_OPEN_CONNS=6
          DB_MAX_IDLE_CONNS=2
          DB_CONN_MAX_IDLE_TIME=1m
          APP_ENV=staging
          JWT_SECRET=
          CORS_ALLOWED_ORIGINS=https://staging.reupgoals.pro
          OPENAI_API_KEY=
          OPENAI_MODEL=gpt-5.6-luna
          OPENAI_AUDITOR_MODEL=gpt-5.6-luna
          OPENAI_ADVISOR_MODEL=gpt-5.6-luna
          OPENAI_TASK_MODEL=gpt-5.6-luna
          OPENAI_AUDITOR_MAX_OUTPUT_TOKENS=1800
          OPENAI_AUDITOR_COMPACT_THRESHOLD=24000
          OPENAI_ADVISOR_COMPACT_THRESHOLD=24000
          ENABLE_AI_BENCHMARK=false
          OPENAI_PROXY_URL=direct
          AI_RATE_LIMIT_PER_MINUTE=60
          AI_DAILY_BUDGET_USD=0
          AI_MONTHLY_BUDGET_USD=0
          AI_JOB_WORKERS=6
          AI_AGENT_JOB_WORKERS=8
          JOB_QUEUE_NAMESPACE=staging
          UNISENDER_API_KEY=
          UNISENDER_BASE_URL=https://api.unisender.com/ru/api
          UNISENDER_SENDER_EMAIL=noreply@reupgoals.pro
          UNISENDER_SENDER_NAME=REUP.goals
          UNISENDER_LIST_ID=
          UNISENDER_SERVICE_LIST_TITLE="REUP.goals service emails"
          BILLING_PAYMENTS_ENABLED=false
          BILLING_ENFORCEMENT_ENABLED=false
          BILLING_ADMIN_KEY=${{ secrets.BILLING_ADMIN_KEY }}
          CLOUDPAYMENTS_PUBLIC_ID=
          CLOUDPAYMENTS_API_SECRET=
          CLOUDPAYMENTS_BASE_URL=https://api.cloudpayments.ru
          CLOUDPAYMENTS_PLAN_NAME="REUP.goals Founder"
          CLOUDPAYMENTS_AMOUNT=3490
          CLOUDPAYMENTS_FIRST_PAYMENT_AMOUNT=3490
          CLOUDPAYMENTS_CURRENCY=RUB
          CLOUDPAYMENTS_TRIAL_DAYS=0
          BROWSER_AUTH_ONLY=true
          FRONTEND_BASE_URL=https://staging.reupgoals.pro
          APP_VERSION="REUP.goals v2"
          SUPPORT_EMAIL=support@reupgoals.pro
          DOCUMENTATION_URL=
          CHANGELOG_URL=
          PRIVACY_MODE=test
          DATA_RESIDENCY_REGION=eu-de
          PRIVACY_CONTACT_EMAIL=privacy@reupgoals.pro
          INVOICE_FONT_PATH=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          CROSS_BORDER_TRANSFER_REGISTERED=false
          GDPR_TRANSFER_MECHANISM=
          RETENTION_INTERVAL=24h
          AUTH_CODE_RETENTION_DAYS=30
          HTTP_REQUEST_LOG_RETENTION_DAYS=90
          PRODUCT_EVENT_RETENTION_DAYS=365
          AI_CALL_LOG_RETENTION_DAYS=180
          BACKGROUND_JOB_RETENTION_DAYS=30
          LEGAL_EVIDENCE_RETENTION_DAYS=1095
          PRIVACY_REQUEST_RETENTION_DAYS=1095
          ENV
            chmod 600 /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^OPENAI_PROXY_URL=' /etc/reup-goals-staging/backend.env; then
            sed -i 's|^OPENAI_PROXY_URL=.*|OPENAI_PROXY_URL=direct|' /etc/reup-goals-staging/backend.env
          else
            printf '\nOPENAI_PROXY_URL=direct\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^APP_ENV=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^APP_ENV=.*/APP_ENV=staging/' /etc/reup-goals-staging/backend.env
          else
            printf '\nAPP_ENV=staging\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^JOB_QUEUE_NAMESPACE=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^JOB_QUEUE_NAMESPACE=.*/JOB_QUEUE_NAMESPACE=staging/' /etc/reup-goals-staging/backend.env
          else
            printf '\nJOB_QUEUE_NAMESPACE=staging\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^OPENAI_MODEL=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^OPENAI_MODEL=.*/OPENAI_MODEL=gpt-5.6-luna/' /etc/reup-goals-staging/backend.env
          else
            printf '\nOPENAI_MODEL=gpt-5.6-luna\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^OPENAI_AUDITOR_MODEL=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^OPENAI_AUDITOR_MODEL=.*/OPENAI_AUDITOR_MODEL=gpt-5.6-luna/' /etc/reup-goals-staging/backend.env
          else
            printf '\nOPENAI_AUDITOR_MODEL=gpt-5.6-luna\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^OPENAI_AUDITOR_MAX_OUTPUT_TOKENS=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^OPENAI_AUDITOR_MAX_OUTPUT_TOKENS=.*/OPENAI_AUDITOR_MAX_OUTPUT_TOKENS=1800/' /etc/reup-goals-staging/backend.env
          else
            printf '\nOPENAI_AUDITOR_MAX_OUTPUT_TOKENS=1800\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^OPENAI_AUDITOR_COMPACT_THRESHOLD=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^OPENAI_AUDITOR_COMPACT_THRESHOLD=.*/OPENAI_AUDITOR_COMPACT_THRESHOLD=24000/' /etc/reup-goals-staging/backend.env
          else
            printf '\nOPENAI_AUDITOR_COMPACT_THRESHOLD=24000\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^OPENAI_ADVISOR_MODEL=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^OPENAI_ADVISOR_MODEL=.*/OPENAI_ADVISOR_MODEL=gpt-5.6-luna/' /etc/reup-goals-staging/backend.env
          else
            printf '\nOPENAI_ADVISOR_MODEL=gpt-5.6-luna\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^OPENAI_TASK_MODEL=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^OPENAI_TASK_MODEL=.*/OPENAI_TASK_MODEL=gpt-5.6-luna/' /etc/reup-goals-staging/backend.env
          else
            printf '\nOPENAI_TASK_MODEL=gpt-5.6-luna\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^OPENAI_ADVISOR_COMPACT_THRESHOLD=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^OPENAI_ADVISOR_COMPACT_THRESHOLD=.*/OPENAI_ADVISOR_COMPACT_THRESHOLD=24000/' /etc/reup-goals-staging/backend.env
          else
            printf '\nOPENAI_ADVISOR_COMPACT_THRESHOLD=24000\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^ENABLE_AI_BENCHMARK=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^ENABLE_AI_BENCHMARK=.*/ENABLE_AI_BENCHMARK=false/' /etc/reup-goals-staging/backend.env
          else
            printf '\nENABLE_AI_BENCHMARK=false\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^AI_JOB_WORKERS=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^AI_JOB_WORKERS=.*/AI_JOB_WORKERS=6/' /etc/reup-goals-staging/backend.env
          else
            printf '\nAI_JOB_WORKERS=6\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^AI_AGENT_JOB_WORKERS=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^AI_AGENT_JOB_WORKERS=.*/AI_AGENT_JOB_WORKERS=8/' /etc/reup-goals-staging/backend.env
          else
            printf '\nAI_AGENT_JOB_WORKERS=8\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^CORS_ALLOWED_ORIGINS=' /etc/reup-goals-staging/backend.env; then
            sed -i 's|^CORS_ALLOWED_ORIGINS=.*|CORS_ALLOWED_ORIGINS=https://staging.reupgoals.pro|' /etc/reup-goals-staging/backend.env
          else
            printf '\nCORS_ALLOWED_ORIGINS=https://staging.reupgoals.pro\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^DB_SSLMODE=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^DB_SSLMODE=.*/DB_SSLMODE=require/' /etc/reup-goals-staging/backend.env
          else
            printf '\nDB_SSLMODE=require\n' >> /etc/reup-goals-staging/backend.env
          fi
          if grep -q '^DB_CONN_MAX_IDLE_TIME=' /etc/reup-goals-staging/backend.env; then
            sed -i 's/^DB_CONN_MAX_IDLE_TIME=.*/DB_CONN_MAX_IDLE_TIME=1m/' /etc/reup-goals-staging/backend.env
          else
            printf '\nDB_CONN_MAX_IDLE_TIME=1m\n' >> /etc/reup-goals-staging/backend.env
          fi

          cloudpayments_public_id=$(grep '^CLOUDPAYMENTS_PUBLIC_ID=' /etc/reup-goals-staging/backend.env | tail -1 | cut -d= -f2- || true)
          cloudpayments_secret=$(grep '^CLOUDPAYMENTS_API_SECRET=' /etc/reup-goals-staging/backend.env | tail -1 | cut -d= -f2- || true)
          payments_enabled=false
          if [ -n "$cloudpayments_public_id" ] && [ -n "$cloudpayments_secret" ]; then
            payments_enabled=true
          fi
          if grep -q '^BILLING_PAYMENTS_ENABLED=' /etc/reup-goals-staging/backend.env; then
            sed -i "s/^BILLING_PAYMENTS_ENABLED=.*/BILLING_PAYMENTS_ENABLED=${payments_enabled}/" /etc/reup-goals-staging/backend.env
          else
            printf '\nBILLING_PAYMENTS_ENABLED=%s\n' "$payments_enabled" >> /etc/reup-goals-staging/backend.env
          fi
          for setting in \
            'BROWSER_AUTH_ONLY=true' \
            'FRONTEND_BASE_URL=https://staging.reupgoals.pro' \
            'APP_VERSION=REUP.goals v2' \
            'SUPPORT_EMAIL=support@reupgoals.pro' \
            'PRIVACY_MODE=test' \
            'DATA_RESIDENCY_REGION=eu-de' \
            'PRIVACY_CONTACT_EMAIL=privacy@reupgoals.pro' \
            'INVOICE_FONT_PATH=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf' \
            'CROSS_BORDER_TRANSFER_REGISTERED=false' \
            'RETENTION_INTERVAL=24h' \
            'HTTP_WRITE_TIMEOUT=0s' \
            'AUTH_CODE_RETENTION_DAYS=30' \
            'HTTP_REQUEST_LOG_RETENTION_DAYS=90' \
            'PRODUCT_EVENT_RETENTION_DAYS=365' \
            'AI_CALL_LOG_RETENTION_DAYS=180' \
            'BACKGROUND_JOB_RETENTION_DAYS=30' \
            'LEGAL_EVIDENCE_RETENTION_DAYS=1095' \
            'PRIVACY_REQUEST_RETENTION_DAYS=1095'; do
            key=${setting%%=*}
            if grep -q "^${key}=" /etc/reup-goals-staging/backend.env; then
              sed -i "s|^${key}=.*|${setting}|" /etc/reup-goals-staging/backend.env
            else
              printf '\n%s\n' "$setting" >> /etc/reup-goals-staging/backend.env
            fi
          done
          if ! grep -Eq '^BILLING_ADMIN_KEY=.{32,}$' /etc/reup-goals-staging/backend.env; then
            generated_billing_key=$(openssl rand -hex 32)
            if grep -q '^BILLING_ADMIN_KEY=' /etc/reup-goals-staging/backend.env; then
              sed -i "s|^BILLING_ADMIN_KEY=.*|BILLING_ADMIN_KEY=${generated_billing_key}|" /etc/reup-goals-staging/backend.env
            else
              printf '\nBILLING_ADMIN_KEY=%s\n' "$generated_billing_key" >> /etc/reup-goals-staging/backend.env
            fi
          fi

          if ! id reupgoals >/dev/null 2>&1; then
            useradd --system --home /opt/reup-goals-staging --shell /usr/sbin/nologin reupgoals
          fi
          chown -R reupgoals:reupgoals /opt/reup-goals-staging/backend

          cat >/etc/systemd/system/reup-goals-staging.service <<'SERVICE'
          [Unit]
          Description=REUP Goals Backend Staging
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/reup-goals-staging/backend
          EnvironmentFile=/etc/reup-goals-staging/backend.env
          ExecStart=/opt/reup-goals-staging/backend/reup_goals_backend
          Restart=always
          RestartSec=3
          StandardOutput=journal
          StandardError=journal
          User=reupgoals
          Group=reupgoals
          NoNewPrivileges=true
          PrivateTmp=true
          PrivateDevices=true
          ProtectSystem=strict
          ProtectHome=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true
          UMask=0077
          ProtectClock=true
          ProtectHostname=true
          RestrictNamespaces=true
          LockPersonality=true
          MemoryDenyWriteExecute=true
          RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

          [Install]
          WantedBy=multi-user.target
          SERVICE

          mkdir -p /etc/systemd/system/reup-goals-staging.service.d
          cat >/etc/systemd/system/reup-goals-staging.service.d/zz-db-pool.conf <<'POOL'
          [Service]
          Environment="DB_APPLICATION_NAME=reup-goals-staging"
          Environment="DB_MAX_OPEN_CONNS=6"
          Environment="DB_MAX_IDLE_CONNS=2"
          POOL
          chmod 600 /etc/systemd/system/reup-goals-staging.service.d/zz-db-pool.conf

          api_site=/etc/nginx/sites-available/api-staging.reupgoals.pro
          if [ ! -f "$api_site" ]; then
            cat >"$api_site" <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name api-staging.reupgoals.pro;

              client_max_body_size 90m;
              gzip on;
              gzip_comp_level 5;
              gzip_min_length 1024;
              gzip_vary on;
              gzip_types application/json text/plain;

              add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_connect_timeout 180s;
                  proxy_send_timeout 180s;
                  proxy_read_timeout 180s;
              }
          }
          NGINX
          fi

          sed -i -E 's/proxy_send_timeout [^;]+;/proxy_send_timeout 3600s;/g' "$api_site"
          sed -i -E 's/proxy_read_timeout [^;]+;/proxy_read_timeout 3600s;/g' "$api_site"

          ln -sf "$api_site" /etc/nginx/sites-enabled/api-staging.reupgoals.pro
          nginx -t
          systemctl reload nginx
          systemctl daemon-reload
          systemctl enable reup-goals-staging.service
          REMOTE

      - name: Upload backend binary
        run: |
          scp -i ~/.ssh/staging_key -o IdentitiesOnly=yes \
            reup_goals_backend \
            agent-runtime.tar.gz \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/tmp/"

      - name: Install and start backend
        run: |
          ssh -i ~/.ssh/staging_key -o IdentitiesOnly=yes \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          previous_binary=/opt/reup-goals-staging/backend/reup_goals_backend.previous
          if [ -x /opt/reup-goals-staging/backend/reup_goals_backend ]; then
            cp -p /opt/reup-goals-staging/backend/reup_goals_backend "$previous_binary"
          fi
          previous_agent_release_id=$(grep '^AGENT_RELEASE_ID=' /etc/reup-goals-staging/backend.env | tail -1 | cut -d= -f2- || true)
          install -o reupgoals -g reupgoals -m 755 /tmp/reup_goals_backend /opt/reup-goals-staging/backend/reup_goals_backend

          runtime_secret=$(grep '^AGENT_RUNTIME_SECRET=' /etc/reup-goals-staging/backend.env | tail -1 | cut -d= -f2- || true)
          if [ "${#runtime_secret}" -lt 32 ]; then
            runtime_secret=$(openssl rand -hex 32)
          fi
          set_backend_env() {
            key=$1
            value=$2
            if grep -q "^${key}=" /etc/reup-goals-staging/backend.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /etc/reup-goals-staging/backend.env
            else
              printf '\n%s=%s\n' "$key" "$value" >> /etc/reup-goals-staging/backend.env
            fi
          }
          set_backend_env AGENT_RUNTIME_SECRET "$runtime_secret"
          set_backend_env AGENT_RUNTIME_URL "http://127.0.0.1:8091"
          set_backend_env AGENT_RUNTIME_MAX_TURNS "120"
          set_backend_env AGENT_RELEASE_ID "staging-${{ hashFiles('agent-runtime/src/**', 'agent-runtime/package-lock.json') }}"
          restore_previous_backend_release() {
            set_backend_env AGENT_RELEASE_ID "$previous_agent_release_id"
            if [ -x "$previous_binary" ]; then
              install -o reupgoals -g reupgoals -m 755 "$previous_binary" /opt/reup-goals-staging/backend/reup_goals_backend
            fi
          }

          openai_api_key=$(grep '^OPENAI_API_KEY=' /etc/reup-goals-staging/backend.env | tail -1 | cut -d= -f2- || true)
          openai_proxy_url=$(grep '^OPENAI_PROXY_URL=' /etc/reup-goals-staging/backend.env | tail -1 | cut -d= -f2- || true)
          if [ "$openai_proxy_url" = "direct" ]; then
            openai_proxy_url=
          fi
          if [ -z "$openai_api_key" ]; then
            echo "OPENAI_API_KEY is required to start the agent runtime."
            exit 1
          fi

          rm -rf /opt/reup-goals-staging/agent.next
          mkdir -p /opt/reup-goals-staging/agent.next
          tar -xzf /tmp/agent-runtime.tar.gz -C /opt/reup-goals-staging/agent.next
          chmod 755 /opt/reup-goals-staging/agent.next/node
          chown -R reupgoals:reupgoals /opt/reup-goals-staging/agent.next
          rm -rf /opt/reup-goals-staging/agent.previous
          if [ -d /opt/reup-goals-staging/agent ]; then
            mv /opt/reup-goals-staging/agent /opt/reup-goals-staging/agent.previous
          fi
          mv /opt/reup-goals-staging/agent.next /opt/reup-goals-staging/agent

          {
            printf 'PORT=8091\n'
            printf 'GO_INTERNAL_URL=http://127.0.0.1:8080\n'
            printf 'AGENT_RUNTIME_SECRET=%s\n' "$runtime_secret"
            printf 'OPENAI_API_KEY=%s\n' "$openai_api_key"
            printf 'AGENT_COMPACT_THRESHOLD=100000\n'
            printf 'AGENT_REASONING_EFFORT=max\n'
            if [ -n "$openai_proxy_url" ]; then
              printf 'OPENAI_PROXY_URL=%s\n' "$openai_proxy_url"
            fi
          } >/etc/reup-goals-staging/agent.env
          chmod 600 /etc/reup-goals-staging/agent.env

          cat >/etc/systemd/system/reup-goals-agent-staging.service <<'SERVICE'
          [Unit]
          Description=REUP Goals Agent Runtime Staging
          After=network-online.target reup-goals-staging.service
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/reup-goals-staging/agent
          Environment=NODE_ENV=production
          EnvironmentFile=/etc/reup-goals-staging/agent.env
          ExecStart=/opt/reup-goals-staging/agent/node dist/server.js
          Restart=always
          RestartSec=3
          StandardOutput=journal
          StandardError=journal
          User=reupgoals
          Group=reupgoals
          NoNewPrivileges=true
          PrivateTmp=true
          PrivateDevices=true
          ProtectSystem=strict
          ProtectHome=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true
          UMask=0077
          ProtectClock=true
          ProtectHostname=true
          RestrictNamespaces=true
          LockPersonality=true
          RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable reup-goals-agent-staging.service
          systemctl restart reup-goals-agent-staging.service
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8091/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              journalctl -u reup-goals-agent-staging.service -n 100 --no-pager
              systemctl stop reup-goals-agent-staging.service || true
              rm -rf /opt/reup-goals-staging/agent
              if [ -d /opt/reup-goals-staging/agent.previous ]; then
                mv /opt/reup-goals-staging/agent.previous /opt/reup-goals-staging/agent
                systemctl restart reup-goals-agent-staging.service || true
              fi
              restore_previous_backend_release
              exit 1
            fi
            sleep 1
          done
          set_backend_env AGENT_RUNTIME_ENABLED "true"

          if ! grep -Eq '^DB_HOST=.+$' /etc/reup-goals-staging/backend.env; then
            echo "Staging backend env is not filled yet. Binary installed, service start skipped."
            exit 0
          fi

          systemctl restart reup-goals-staging.service
          systemctl status reup-goals-staging.service --no-pager

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              journalctl -u reup-goals-staging.service -n 100 --no-pager
              if [ -x "$previous_binary" ]; then
                echo "New backend failed health check; restoring previous binary."
                restore_previous_backend_release
                if [ -d /opt/reup-goals-staging/agent.previous ]; then
                  echo "Restoring the matching previous agent runtime."
                  systemctl stop reup-goals-agent-staging.service || true
                  rm -rf /opt/reup-goals-staging/agent.failed
                  if [ -d /opt/reup-goals-staging/agent ]; then
                    mv /opt/reup-goals-staging/agent /opt/reup-goals-staging/agent.failed
                  fi
                  mv /opt/reup-goals-staging/agent.previous /opt/reup-goals-staging/agent
                  systemctl restart reup-goals-agent-staging.service || true
                fi
                systemctl restart reup-goals-staging.service
                for rollback_attempt in $(seq 1 30); do
                  if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
                    echo "Previous backend restored successfully."
                    break
                  fi
                  if [ "$rollback_attempt" -eq 30 ]; then
                    echo "Previous backend also failed health check."
                  fi
                  sleep 1
                done
              fi
              exit 1
            fi
            sleep 1
          done

          api_site=/etc/nginx/sites-available/api-staging.reupgoals.pro
          if ! grep -Eq 'listen[[:space:]]+443[[:space:]]+ssl' "$api_site"; then
            certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email \
              -d api-staging.reupgoals.pro --redirect || true
          fi
          sed -i -E 's/listen 443 ssl;/listen 443 ssl http2;/' /etc/nginx/sites-available/api-staging.reupgoals.pro
          sed -i -E 's/listen \[::\]:443 ssl;/listen [::]:443 ssl http2;/' /etc/nginx/sites-available/api-staging.reupgoals.pro
          nginx -t
          systemctl reload nginx
          REMOTE
